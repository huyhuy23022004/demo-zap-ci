<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập — DemoShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-shield-lock-fill me-2"></i>DemoShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Trang chủ</a>
            <a class="nav-link" href="/products"><i class="bi bi-box-seam me-1"></i>Sản phẩm</a>
        </div>
    </div>
</nav>

<main>
<div class="login-wrapper">
    <div class="login-card animate-in">
        <div class="login-header">
            <i class="bi bi-shield-lock display-4 d-block mb-2" style="color:rgba(255,255,255,0.9)"></i>
            <h3>Đăng nhập</h3>
            <p>Nhập thông tin tài khoản để tiếp tục</p>
        </div>
        <div class="login-body">
            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label">Tài khoản</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Nhập username" required />
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Nhập password" required />
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Ẩn/Hiện mật khẩu">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3" style="border-top: 1px solid #e2e8f0;">
                <p class="text-muted mb-2" style="font-size:0.85rem">Tài khoản demo</p>
                <div class="row g-2">
                    <div class="col-6">
                        <div class="p-2 rounded" style="background:#f8fafc;">
                            <small class="d-block fw-bold text-gradient">ADMIN</small>
                            <code style="font-size:0.8rem">admin / admin123</code>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-2 rounded" style="background:#f8fafc;">
                            <small class="d-block fw-bold text-gradient">USER</small>
                            <code style="font-size:0.8rem">user / user123</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<!-- FOOTER -->
<footer class="footer">
    <div class="container text-center">
        <span class="footer-brand">DemoShop</span>
        <p class="mb-0">&copy; 2026 DevSecOps Demo. All rights reserved.</p>
    </div>
</footer>

<script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const toggleIcon = document.getElementById('toggleIcon');

    toggleBtn.addEventListener('click', function () {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('bi-eye');
            toggleIcon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('bi-eye-slash');
            toggleIcon.classList.add('bi-eye');
        }
    });
</script>
</body>
</html>
