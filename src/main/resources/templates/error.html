<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Error ' + (${status} ?: '500') + ' — DemoShop'">Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-shield-lock-fill me-2"></i>DemoShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Trang chủ</a>
            <a class="nav-link" href="/products"><i class="bi bi-box-seam me-1"></i>Sản phẩm</a>
        </div>
    </div>
</nav>

<main>
<div class="login-wrapper">
    <div class="text-center animate-in">
        <div class="mb-4">
            <span class="display-1" style="color: var(--primary);">
                <i class="bi" th:classappend="${status == 403} ? 'bi-shield-x' : (${status == 404} ? 'bi-search' : 'bi-exclamation-triangle')"></i>
            </span>
        </div>
        <h1 class="display-3 fw-bold mb-2" th:text="${status} ?: '500'">500</h1>
        <h3 class="fw-bold mb-3" th:text="${status == 403} ? 'Truy cập bị từ chối' : (${status == 404} ? 'Không tìm thấy trang' : 'Lỗi hệ thống')">Error</h3>
        <p class="text-muted mb-4" style="max-width:450px; margin:0 auto;"
           th:text="${status == 403} ? 'Bạn không có quyền truy cập trang này. Vui lòng đăng nhập với tài khoản có quyền Admin.' : (${status == 404} ? 'Trang bạn đang tìm kiếm không tồn tại hoặc đã bị di chuyển.' : 'Đã xảy ra lỗi không mong muốn. Vui lòng thử lại sau.')">
            Error message
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-gradient"><i class="bi bi-house me-2"></i>Về trang chủ</a>
            <a href="/login" class="btn btn-outline-primary"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</a>
        </div>
    </div>
</div>
</main>

<footer class="footer">
    <div class="container text-center">
        <span class="footer-brand">DemoShop</span>
        <p class="mb-0">&copy; 2026 DevSecOps Demo</p>
    </div>
</footer>

</body>
</html>
